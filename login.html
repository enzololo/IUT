
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Matcha Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ====== EN-TÊTE : logo + navigation ====== -->
    <header class="site-header">
        <div class="site-header__inner">
            <a href="index.html" class="site-header__logo">Matcha Lab</a>
            <nav class="site-header__nav">
                <a href="index.html" class="site-header__link">Accueil</a>
                <a href="login.html" class="site-header__link site-header__link--active">Connexion</a>
                <a href="panier.html" class="site-header__link ">Panier</a>
            </nav>
        </div>
    </header>

    <!-- ====== CONTENU PRINCIPAL ====== -->
    <main>

        <!-- Section connexion : formulaire centré dans une carte -->
        <section class="login">
            <h1 class="login__title">Se connecter</h1>

            <form class="login-form" action="index.html" method="get">

                <!-- Champ Email -->
                <label for="email" class="login-form__label">Adresse e-mail</label>
                <input type="email" id="email" name="email" placeholder="vous@exemple.com" required class="login-form__input">

                <!-- Champ Mot de passe -->
                <label for="password" class="login-form__label">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required class="login-form__input">

                <!-- Bouton de soumission (redirige vers index.html via action) -->
                <button type="submit" class="login-form__button">Se connecter</button>

                <!-- Liens d'aide en dessous du formulaire -->
                <p class="login-form__links">
                    <a href="index.html" class="login-form__link">Mot de passe oublié ?</a>
                </p>
                <p class="login-form__links">
                    <a href="index.html" class="login-form__link">Créer un compte</a>
                </p>

            </form>
        </section>

    </main>

    <!-- ====== PIED DE PAGE ====== -->
    <footer class="site-footer">
        <p class="site-footer__text">&copy; 2026 Matcha Lab</p>
    </footer>

</body>
</html>
